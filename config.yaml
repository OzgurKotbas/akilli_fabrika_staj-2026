# Akıllı Fabrika — Pan-Tilt Robot Projesi
# Anomali Tespiti Modülü Ortak Yapılandırma Dosyası

deployment:
  default_id: "default"
  
mqtt:
  broker: "${MQTT_BROKER:-localhost}"
  port: 1883
  topic_base: "${MQTT_TOPIC_BASE:-patrol/alert}"
  client_id_prefix: "anomali_modul"

vision:
  # PatchCore Ayarları
  patchcore_thresh: 0.50
  
  # MOG2 (Arka Plan Çıkarma) Ayarları
  mog2_history: 200
  mog2_thresh: 20
  mog2_window_s: 10
  min_area: 1500
  max_area_ratio: 0.40
  
  # Sarı Güvenlik Çizgisi HSV Sınırları (H, S, V)
  yellow_hsv_lower: [18, 80, 80]
  yellow_hsv_upper: [38, 255, 255]
  yellow_dilate_px: 12

  # FP Düzeltme Ayarları (demo_anomali v2)
  tavan_crop_oran: 0.18
  rotation_flow_thresh: 0.50   # medyan optik akış; boş koridor ~0.38, yürüyüş ~1-3
  mog2_lr_drift_reset: 0.08
  mog2_warmup_n: 40

  # Hizalamalı Anomali (ORB + RANSAC) Ayarları
  orb_features: 2000
  ransac_min_match: 12
  ransac_min_inlier: 10
  mad_k: 6.0
  min_abs_diff: 18
  morph_size: 7
  parlama_v: 235
  parlama_s: 45
  parlama_dilate: 9
  sari_dilate: 15

paths:
  # Proje kök dizinine (ROOT) göre göreceli yollar
  waypoints_yaml: "data/waypoints/waypoint_listesi.yaml"
  patchcore_ckpt: "outputs/model_results/ip6_patchcore_ckpt"
  etiketler_json: "data/ip8_test/etiketler.json"
  
  # Varsayılan test videoları
  default_altin_video: "data/raw_videos/altin_tur_v2.mp4"
  default_engel_video: "data/raw_videos/engel.mp4"
  default_koridor_video: "data/raw_videos/koridor_992.mp4"
  ensemble_ozet_json: "data/ip9_ensemble/ensemble_ozet.json"
  referans_kareler_dir: "data/waypoints/referans_kareler"
  ip8_test_dir: "data/ip8_test"
